optimizer:
  type: "AdamW"
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  fused: true
  weight_decay: 0.1

lr_schedule:
  base_lr: 1.0e-3
  max_lr: 3.0e-3
  ref_tokens_per_step: 65536
  warmup_ratio: 0.03
  min_warmup_steps: 5
  min_lr_ratio: 0.1


training:
  total_tokens: 50000000
  grad_clip: 1.0
  precision: "fp16"
  loss_chunk_size: 4096
  seed: 1337
  grad_scaler_init: 16384
  eval_points: 20
  log_every: 10
  checkpoint_points: 10
